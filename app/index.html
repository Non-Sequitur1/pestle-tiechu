<!DOCTYPE html>
<html lang="zh-Hans">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>铁杵 · 题海研磨机</title>
  <link rel="stylesheet" href="../assets/style.css">
  <meta name="robots" content="index,follow">
  <meta name="description" content="铁杵：按题型刷大学真题、背解题模板、看被考概率与历年趋势。">
  <script>
    window.MathJax = {
      tex: { inlineMath: [["$", "$"], ["\\(", "\\)"]], displayMath: [["$$", "$$"], ["\\[", "\\]"]] },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        chtml: { fontURL: "../assets/vendor/mathjax-fonts" } // local Computer-Modern woff glyphs
      },
      startup: { typeset: false }
    };
  </script>
  <script src="../assets/vendor/mathjax.js"></script>
  <script src="../assets/vendor/marked.min.js"></script>
  <script src="../assets/vendor/purify.min.js"></script>
  <script src="../assets/i18n.js"></script>
  <link rel="preload" href="./index.js" as="script">
</head>

<body>
  <div id="loadingBanner" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.7); color: white; text-align: center; padding: 20px; z-index: 9999;">
    <span data-i18n="loading">题库加载中……</span>
  </div>
  <div id="root">
    <div id="appContainer" class="h-full w-full">
      <div id="left-col" class="flex flex-col bg-white p-2">
        <div class="p-2"><a href="../index.html"><button class="btn-primary" id="homeBtn">← <span
              data-i18n="back-home">回首页</span></button></a></div>
        <div class="p-2 module-card" id="moduleCard">
          <div class="font-bold" id="moduleCode">MODCODE001</div>
          <div class="text-neutralVariant" id="moduleName">…</div>
          <div class="text-neutralVariant" id="moduleStats">…</div>
        </div>
        <nav id="mainNav" class="flex flex-col gap-1 p-2">
          <button class="nav-btn" data-view="bank" data-i18n="nav-bank">刷题</button>
          <button class="nav-btn" data-view="formats" data-i18n="nav-formats">题型归纳</button>
          <button class="nav-btn" data-view="keypoints" data-i18n="nav-keypoints">高频考点</button>
          <button class="nav-btn" data-view="intel" data-i18n="nav-intel">科目情报</button>
          <button class="nav-btn" data-view="papers" data-i18n="nav-papers">试卷中心</button>
          <button class="nav-btn" data-view="notes" data-i18n="nav-notes">基础知识补给站</button>
          <button class="nav-btn" data-view="pomodoro" data-i18n="nav-pomodoro">番茄钟</button>
        </nav>
        <div class="p-2 mt-auto text-neutralVariant text-sm" id="progressCard">
          <div data-i18n="practice-progress">刷题进度</div>
          <div id="progressNum">0 / 0</div>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="p-2 text-neutralVariant text-sm" id="sidebarFooter">
          <span data-i18n="about-brand" data-credit="伦敦红星软件 出品">铁杵 · 伦敦红星软件 出品</span>
        </div>
      </div>
      <div id="right-wrapper">
        <div id="upper-right-col" class="flex flex-col bg-gray-100 p-2">
          <div class="toolbar">
            <div id="pomoChip" class="pomo-chip" title="Pomodoro">
              <span id="pomoChipIcon">🍅</span>
              <span id="pomoChipTime">25:00</span>
            </div>
            <select id="langSel" aria-label="language">
              <option value="zh-Hans">简体中文</option>
              <option value="zh-Hant">繁體中文</option>
              <option value="en">English</option>
            </select>
            <button id="darkmodebtn" class="btn-primary" onclick="toggleDarkMode()">Dark Mode</button>
            <button id="helpbtn" class="btn-secondary" onclick="toggleHelp()">Help</button>
          </div>
          <h2 id="viewTitle" class="p-2"></h2>
          <div id="kindBar" class="kind-bar p-2 hidden"></div>
          <div id="filterBar" class="selectables p-2"></div>
        </div>
        <div id="right-col" class="flex flex-col bg-gray-100 p-2"></div>
      </div>
      <nav id="bottomNav" class="bottom-nav">
        <button class="nav-btn" data-view="bank" data-i18n="nav-bank">刷题</button>
        <button class="nav-btn" data-view="formats" data-i18n="nav-formats-short">题型</button>
        <button class="nav-btn" data-view="keypoints" data-i18n="nav-keypoints-short">考点</button>
        <button class="nav-btn" data-view="intel" data-i18n="nav-intel-short">情报</button>
        <button class="nav-btn" data-view="papers" data-i18n="nav-papers-short">试卷</button>
        <button class="nav-btn" data-view="notes" data-i18n="nav-notes-short">补给</button>
        <button class="nav-btn" data-view="pomodoro" data-i18n="nav-pomodoro-short">番茄</button>
      </nav>
    </div>
  </div>

  <div id="helpmenu" style="z-index: 99999;"
    class="fixed left-0 top-0 hidden flex h-full w-full items-center justify-center bg-black/70">
    <div class="flex h-full w-full md:h-3/4 md:w-3/4 flex-col border bg-gray-100 p-4 dark:bg-darkCard">
      <div class="flex justify-between">
        <h3 data-i18n="help-title">帮助 · 铁杵使用指南</h3>
        <button class="btn-primary" onclick="toggleHelp()" data-i18n="close">关闭</button>
      </div>
      <div class="m-0 mt-2 overflow-auto p-0 font-serif max-h-60vh">
        <p data-i18n="help-intro"></p>
        <ol id="helpSteps"></ol>
        <p class="text-neutralVariant" data-i18n="offline-note"></p>
        <p class="text-neutralVariant" data-i18n="print-note"></p>
      </div>
    </div>
  </div>

  <script src="./index.js"></script>
</body>

</html>
